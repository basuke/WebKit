<!-- webkit-test-runner [ SiteIsolationEnabled=true SiteIsolationGlobalDebuggerPauseEnabled=true ] -->
<script src="../../../inspector/resources/inspector-test.js"></script>
<script src="resources/site-isolation-debugger-test-utilities.js"></script>
<script>
function busyWait(ms)
{
    let end = performance.now() + ms;
    while (performance.now() < end) { }
}

function stepOverBusyStatements()
{
    debugger;
    busyWait(300);
    busyWait(300);
    return "done";
}

async function awaitReplyFromFrame()
{
    debugger;
    await new Promise((resolve) => {
        window.addEventListener("message", (event) => {
            window.reply = event.data;
            resolve();
        }, { once: true });
        document.getElementById("frame").contentWindow.postMessage("ping", "*");
    });
    return window.reply;
}

function stepOutOfOutermostFrame()
{
    debugger;
}

function test() {
    let suite = InspectorTest.createAsyncSuite("SiteIsolation.Debugger.PauseHoldsCrossProcessFramesWhileStepping");

    let mainTarget;
    let crossProcessTarget;

    async function evaluate(target, expression) {
        let {result} = await target.RuntimeAgent.evaluate.invoke({expression, objectGroup: "test", returnByValue: true});
        return result.value;
    }

    function awaitPause(target) {
        return new Promise((resolve) => {
            let listener = WI.debuggerManager.addEventListener(WI.DebuggerManager.Event.CallFramesDidChange, (event) => {
                if (event.data.target !== target || !WI.debuggerManager.dataForTarget(target).paused)
                    return;
                WI.debuggerManager.removeEventListener(WI.DebuggerManager.Event.CallFramesDidChange, listener);
                resolve();
            });
        });
    }

    async function pause(target, expression) {
        let paused = awaitPause(target);
        target.RuntimeAgent.evaluate.invoke({expression, objectGroup: "test"}).catch(() => { });
        await paused;
    }

    async function resume() {
        let resumed = WI.debuggerManager.awaitEvent(WI.DebuggerManager.Event.Resumed);
        await WI.debuggerManager.resume();
        await resumed;
    }

    suite.addTestCase({
        name: "SiteIsolation.Debugger.PauseHoldsCrossProcessFramesWhileStepping.Setup",
        description: "Find the frame target of a cross-site iframe, which runs in another process.",
        async test() {
            mainTarget = InspectorTest.mainFrameTarget;
            crossProcessTarget = await frameTargetForURLContaining("replying-frame.html");
            InspectorTest.expectNotNull(crossProcessTarget, "Should find the cross-site frame target.");
            InspectorTest.expectThat(await waitForExpressionInTarget(crossProcessTarget, "window.ticks > 2"), "The cross-site frame's interval should be running.");
        }
    });

    suite.addTestCase({
        name: "SiteIsolation.Debugger.PauseHoldsCrossProcessFramesWhileStepping.StepOver",
        description: "Stepping over statements in the main frame should keep the cross-site frame held between steps.",
        async test() {
            await pause(mainTarget, "stepOverBusyStatements()");
            // Step from the debugger statement to the first busy statement.
            await WI.debuggerManager.stepOver();
            let before = await evaluate(crossProcessTarget, "window.ticks");

            for (let step = 1; step <= 2; ++step) {
                await WI.debuggerManager.stepOver();
                InspectorTest.expectEqual(await evaluate(crossProcessTarget, "window.ticks"), before, `The cross-site frame's interval should not advance while stepping over busy statement ${step}.`);
            }

            await resume();
            InspectorTest.expectThat(await waitForExpressionInTarget(crossProcessTarget, `window.ticks > ${before}`), "The cross-site frame's interval should advance after resuming.");
        }
    });

    suite.addTestCase({
        name: "SiteIsolation.Debugger.PauseHoldsCrossProcessFramesWhileStepping.StepOverAwait",
        description: "Stepping over an await should let the cross-site frame run, so that a promise it resolves can settle and the step can pause after the await.",
        async test() {
            await pause(mainTarget, "awaitReplyFromFrame()");
            await WI.debuggerManager.stepOver();

            let pausedAfterAwait = awaitPause(mainTarget);
            await WI.debuggerManager.stepOver();
            await pausedAfterAwait;

            InspectorTest.expectEqual(WI.debuggerManager.activeCallFrame.functionName, "awaitReplyFromFrame", "Should pause again in the async function after the await.");
            InspectorTest.expectEqual(await evaluate(mainTarget, "window.reply"), "reply", "The cross-site frame should have answered the message posted before the await.");
            await resume();
        }
    });

    suite.addTestCase({
        name: "SiteIsolation.Debugger.PauseHoldsCrossProcessFramesWhileStepping.StepOutOfOutermostFrame",
        description: "Stepping out of the outermost frame leaves the VM, so the cross-site frame should run again.",
        async test() {
            await pause(mainTarget, "setTimeout(stepOutOfOutermostFrame)");
            let before = await evaluate(crossProcessTarget, "window.ticks");

            await WI.debuggerManager.stepOut();
            InspectorTest.expectFalse(WI.debuggerManager.paused, "The debugger should not be paused after stepping out of the outermost frame.");
            InspectorTest.expectThat(await waitForExpressionInTarget(crossProcessTarget, `window.ticks > ${before}`), "The cross-site frame's interval should advance after stepping out of the outermost frame.");
        }
    });

    suite.runTestCasesAndFinish();
}
</script>

<body onload="runTest()">
<p>Test that stepping in a paused frame keeps the frames of the same page in other processes held between steps, and that a step that leaves the VM lets them run.</p>
<iframe id="frame" src="http://localhost:8000/site-isolation/inspector/debugger/resources/replying-frame.html"></iframe>
</body>
