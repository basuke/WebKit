<!-- webkit-test-runner [ SiteIsolationEnabled=true SiteIsolationGlobalDebuggerPauseEnabled=true ] -->
<script src="../../../inspector/resources/inspector-test.js"></script>
<script src="resources/site-isolation-debugger-test-utilities.js"></script>
<script>
window.mainTicks = 0;
setInterval(() => { window.mainTicks++; }, 50);

function test() {
    let suite = InspectorTest.createAsyncSuite("SiteIsolation.Debugger.PauseHoldsCrossProcessFramesUntilFocusedPausedFrameIsRemoved");

    function sleep(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
    }

    async function evaluate(target, expression) {
        let {result} = await target.RuntimeAgent.evaluate.invoke({expression, objectGroup: "test", returnByValue: true});
        return result.value;
    }

    async function pause(target) {
        let paused = new Promise((resolve) => {
            let listener = WI.debuggerManager.addEventListener(WI.DebuggerManager.Event.CallFramesDidChange, (event) => {
                if (event.data.target !== target || !WI.debuggerManager.dataForTarget(target).paused)
                    return;
                WI.debuggerManager.removeEventListener(WI.DebuggerManager.Event.CallFramesDidChange, listener);
                resolve();
            });
        });
        target.RuntimeAgent.evaluate.invoke({expression: "pauseHere()", objectGroup: "test"}).catch(() => { });
        await paused;
    }

    suite.addTestCase({
        name: "SiteIsolation.Debugger.PauseHoldsCrossProcessFramesUntilFocusedPausedFrameIsRemoved.PausedFocusedFrameRemoved",
        description: "If the paused cross-site frame has focus when it is removed, the UI process keeps it alive as the focused frame, and the main frame should still run again.",
        async test() {
            let target = await waitForFrameTargetForURLContaining("same-process-frame.html");
            InspectorTest.expectNotNull(target, "Should find the frame target of the cross-site frame.");
            InspectorTest.expectThat(await waitForExpressionInTarget(target, "window.ticks > 2"), "The cross-site frame's interval should be running.");

            await evaluate(InspectorTest.mainFrameTarget, `(() => {
                let rect = document.getElementById("frame").getBoundingClientRect();
                eventSender.mouseMoveTo(rect.left + 20, rect.top + 20);
                eventSender.mouseDown();
                eventSender.mouseUp();
            })()`);
            InspectorTest.expectThat(await waitForExpressionInTarget(target, "document.hasFocus()"), "The cross-site frame should have focus after a click.");

            await pause(target);
            let before = await evaluate(InspectorTest.mainFrameTarget, "window.mainTicks");
            await sleep(300);
            InspectorTest.expectEqual(await evaluate(InspectorTest.mainFrameTarget, "window.mainTicks"), before, "The main frame's interval should not advance while the cross-site frame is paused.");

            await evaluate(InspectorTest.mainFrameTarget, "document.getElementById('frame').remove()");
            InspectorTest.expectThat(await waitForExpressionInTarget(InspectorTest.mainFrameTarget, `window.mainTicks > ${before}`), "The main frame's interval should advance after the focused paused frame is removed.");

            // The removed frame stays paused in its own process, so do not leave it paused for the tests that run after this one.
            if (WI.debuggerManager.dataForTarget(target).paused)
                await target.DebuggerAgent.resume();
        }
    });

    suite.runTestCasesAndFinish();
}
</script>

<body onload="runTest()">
<iframe id="frame" src="http://localhost:8000/site-isolation/inspector/debugger/resources/same-process-frame.html"></iframe>
<p>Test that the frames held for a paused cross-site frame run again when the paused frame is removed while it has focus, since the UI process then keeps the removed frame alive as its focused frame.</p>
</body>
